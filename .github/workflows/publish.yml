name: Publish to NuGet

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore Sage.Active.sln

    - name: Build solution
      run: dotnet build Sage.Active.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/Sage.Active.Tests/Sage.Active.Tests.csproj --configuration Release --no-build

    - name: Pack packages
      run: dotnet pack Sage.Active.sln --configuration Release --output ./artifacts --no-build

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
