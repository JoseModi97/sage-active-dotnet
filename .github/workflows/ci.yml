name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore Sage.Active.sln

    - name: Build solution
      run: dotnet build Sage.Active.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/Sage.Active.Tests/Sage.Active.Tests.csproj --configuration Release --no-build --verbosity normal
